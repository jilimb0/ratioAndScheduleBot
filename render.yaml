services:
- type: web
  name: telegram-schedule-bot
  plan: free
  runtime: node
  buildCommand: corepack prepare pnpm@10 --activate && pnpm install --frozen-lockfile && pnpm build
  startCommand: node dist-server/server.mjs
  healthCheckPath: /health
  autoDeploy: true
  envVars:
  - key: BOT_TOKEN
    sync: false
  - key: WEBHOOK_URL
    sync: false
  - key: PORT
    value: 8000
  - key: TZ
    value: Asia/Tbilisi
  - key: DATABASE_PATH
    value: /data/bot_data.db
