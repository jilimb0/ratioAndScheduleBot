name: 'UDPA Institutional Quality & Security Gate'

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  udpa-gate:
    name: 'UDPA Gate & Ed25519 ZK-Passport'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Run UDPA Composite Gate
        uses: ./services-and-apps/udpa-engine
        with:
          target-path: '.'
          min-score: '85'
          stage: 'Scale'
          sarif-output: 'udpa-audit.sarif'
          passport-output: 'udpa-zk-passport.json'

      - name: Upload OASIS SARIF to GitHub Security Tab
        uses: github/codeql-action/upload-sarif@v3
        if: always()
        with:
          sarif_file: 'udpa-audit.sarif'

      - name: Archive Zero-Knowledge Passport
        uses: actions/upload-artifact@v4
        with:
          name: udpa-zk-passport
          path: udpa-zk-passport.json
