# Reports CI failures to the central ci-notifications repo as a GitHub Issue.
# Requires a CI_NOTIFICATIONS_TOKEN secret (fine-grained PAT with Issues:write on jilimb0/ci-notifications).
name: Notify CI Failure

on:
  workflow_run:
    workflows: ["*"]
    types: [completed]

permissions:
  contents: read

concurrency:
  group: notify-${{ github.repository }}-${{ github.event.workflow_run.id }}
  cancel-in-progress: true

jobs:
  notify:
    if: >-
      github.event.workflow_run.conclusion == 'failure' &&
      github.event.workflow_run.event != 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Verify token is configured
        id: check
        env:
          TOKEN: ${{ secrets.CI_NOTIFICATIONS_TOKEN }}
        run: |
          if [ -z "$TOKEN" ]; then
            echo "::warning::CI_NOTIFICATIONS_TOKEN is not set — cannot file an issue"
            echo "ok=false" >> "$GITHUB_OUTPUT"
          else
            echo "ok=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Create issue in ci-notifications
        if: steps.check.outputs.ok == 'true'
        uses: actions/github-script@v7
        env:
          CI_NOTIFICATIONS_TOKEN: ${{ secrets.CI_NOTIFICATIONS_TOKEN }}
        with:
          github-token: ${{ secrets.CI_NOTIFICATIONS_TOKEN }}
          script: |
            const run = context.payload.workflow_run;
            const failedAt = new Date(run.updated_at);
            const title = `CI failure: ${run.name} — ${context.repo.owner}/${run.repository.name}`;

            const body = [
              `## Workflow failed`,
              '',
              `| Field | Value |`,
              `| --- | --- |`,
              `| Project | \`${run.repository.name}\` |`,
              `| Workflow | ${run.name} |`,
              `| Branch | \`${run.head_branch}\` |`,
              `| Commit | \`${run.head_sha.slice(0, 7)}\` |`,
              `| Triggered by | \`${run.event}\` |`,
              `| Conclusion | **${run.conclusion}** |`,
              `| Started | ${run.run_started_at} |`,
              '',
              `[Open run log](${run.html_url})`,
              `[Source commit](https://github.com/${run.repository.name}/commit/${run.head_sha})`,
              '',
              `Filed automatically by \`${context.repo.owner}/${context.repo.repo}/.github/workflows/notify-ci-failure.yml\`.`,
              '<!-- repo:' + run.repository.name + ' run:' + run.id + ' -->',
            ].join('\n');

            // Dedupe: one open issue per failed run.
            const marker = `<!-- repo:${run.repository.name} run:${run.id} -->`;
            const existing = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: 'ci-notifications',
              state: 'open',
              per_page: 100,
            });

            const prior = existing.data.find((i) => (i.body || '').includes(marker));
            if (prior) {
              core.info(`Issue already filed for this run: #${prior.number}`);
              return;
            }

            const created = await github.rest.issues.create({
              owner: context.repo.owner,
              repo: 'ci-notifications',
              title,
              body,
              labels: ['ci-failure'],
            });
            core.info(`Filed issue #${created.data.number}`);
